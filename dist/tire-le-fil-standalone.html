/* Tire le fil — BNE Experience
   Bühne: 1080 × 1920 Pixel (9:16), wird per JavaScript auf jede Hochformat-Auflösung skaliert.
   Alle Maße unten sind Bühnenpixel. 1 px entspricht auf dem 50-Zoll-Bildschirm ca. 0,57 mm. */

:root {
  --sure: #0E2C31;        /* Grund: tiefes Flusswasser */
  --sure-deep: #08191C;   /* Vignette, Dock */
  --moss: #17393E;        /* erhabene Flächen */
  --moss-2: #1F4A50;
  --linen: #F2F4EC;       /* Text auf dunkel, Etiketten */
  --lichen: #A9C5BF;      /* Sekundärtext */
  --ink: #10282C;         /* Text auf Etiketten */
  --ink-soft: #3E5A5E;
  --glow: #FFE7A3;        /* Berührungs- und Fokushinweis */
  /* Semantische Rollen: beide Designvarianten setzen dieselben Namen */
  --text: var(--linen);              /* Text auf der Bühne */
  --paper: var(--linen);             /* Etiketten, Karten */
  --btn-bg: var(--linen); --btn-ink: var(--ink);
  --ghost-bg: rgba(8, 25, 28, .55);
  --line-1: rgba(242, 244, 236, .16); --line-2: rgba(242, 244, 236, .5);
  --surface: var(--moss); --surface-2: rgba(242, 244, 236, .08); --surface-ok: #1F4D47;
  --halo: 0 2px 14px rgba(8, 25, 28, .95), 0 0 34px rgba(8, 25, 28, .85), 0 0 3px rgba(8, 25, 28, .9);
  --string: rgba(242, 244, 236, .75); --string-soft: rgba(242, 244, 236, .4); --ring-track: rgba(242, 244, 236, .16);
  --bead-edge: #08191C; --logo-ink: #F2F4EC; --dock-bg: linear-gradient(to top, rgba(5, 16, 18, .97), rgba(5, 16, 18, .86));
  --tag-shadow: drop-shadow(0 22px 34px rgba(0, 0, 0, .38));
  --scrim: rgba(5, 16, 18, .72); --overlay: rgba(5, 16, 18, .86);
  --stage-bg:
    radial-gradient(1200px 900px at 50% 38%, #15414A 0%, rgba(21, 65, 74, 0) 70%),
    radial-gradient(900px 700px at 80% 95%, #123A3A 0%, rgba(18, 58, 58, 0) 70%),
    var(--sure);
  --vignette: radial-gradient(1400px 2100px at 50% 45%, rgba(8, 25, 28, 0) 55%, rgba(8, 25, 28, .75) 100%);
  --surround: #DADFD9;    /* Umgebung um die Bühne (nur Vorschau) */
  --surround-ink: #36484B;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
  --font-text: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", "DejaVu Sans", system-ui, sans-serif;

  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.3, 1.5, .5, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --surround: #050F11; --surround-ink: #9DB4AF; color-scheme: dark; }
}
:root[data-theme="dark"] { --surround: #050F11; --surround-ink: #9DB4AF; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--surround);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
body.hide-cursor, body.hide-cursor * { cursor: none !important; }

#viewport {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative; flex: none;
  width: 1080px; height: 1920px;
  transform-origin: center center;
  overflow: hidden;
  background: var(--stage-bg);
  color: var(--text);
  transition: background .6s;
  font-family: var(--font-text);
  font-size: 36px; line-height: 1.42;
  touch-action: none;
}
#stage::after { /* Vignette */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: var(--vignette);
}
body.is-preview #stage { box-shadow: 0 40px 120px rgba(0, 0, 0, .45), 0 0 0 18px #0B0F10, 0 0 0 20px #2A3235; border-radius: 6px; }
#preview-caption {
  position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
  font: 500 14px/1.4 var(--font-text); color: var(--surround-ink); display: none; text-align: center;
  padding: 0 16px; max-width: 90vw;
}
body.is-preview #preview-caption { display: block; }

#fil { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 0; }

/* ---------- Typografie ---------- */
.t-hero  { font-family: var(--font-display); font-weight: 800; font-size: 120px; line-height: .95; letter-spacing: -.03em; }
.t-h1    { font-family: var(--font-display); font-weight: 750; font-size: 88px; line-height: 1.0; letter-spacing: -.025em; }
.t-h2    { font-family: var(--font-display); font-weight: 700; font-size: 66px; line-height: 1.06; letter-spacing: -.02em; }
.t-h3    { font-family: var(--font-display); font-weight: 650; font-size: 48px; line-height: 1.12; letter-spacing: -.012em; }
.t-lead  { font-size: 40px; line-height: 1.36; }
.t-body  { font-size: 36px; line-height: 1.42; }
.t-small { font-size: 30px; line-height: 1.36; }
.t-mini  { font-size: 26px; line-height: 1.3; }
.muted   { color: var(--lichen); }
.center  { text-align: center; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
.balance { text-wrap: balance; }
.pretty  { text-wrap: pretty; }
.hyph    { -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.fit     { overflow: hidden; padding-bottom: .12em; }
.nowrap  { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Ebenen ---------- */
#topbar { position: absolute; left: 0; top: 0; width: 1080px; height: 120px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; }
#screen { position: absolute; left: 0; top: 120px; width: 1080px; height: 1660px; z-index: 3; }
#dock   { position: absolute; left: 0; top: 1780px; width: 1080px; height: 140px; z-index: 6; display: flex; align-items: center; gap: 22px; padding: 0 40px 6px;
          background: var(--dock-bg); }
#overlay-root { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#overlay-root > * { pointer-events: auto; }
#overlay-root > .toast { pointer-events: none; }

/* Markenzeile */
.brand { display: flex; align-items: baseline; gap: 20px; position: relative; }
.brand-mark { font-family: var(--font-display); font-weight: 800; font-size: 46px; letter-spacing: -.02em; color: var(--text); }
.brand-logo { height: 64px; width: auto; display: block; }
.brand-desc { font-size: 24px; color: var(--lichen); }
.brand-hold { position: absolute; left: -10px; bottom: -14px; height: 4px; width: 0; background: var(--glow); border-radius: 4px; transition: none; }
.top-right { display: flex; align-items: center; gap: 18px; }
.loc { display: flex; align-items: center; gap: 10px; font-size: 26px; color: var(--lichen); }
.loc svg { width: 30px; height: 30px; }
.badge { font-size: 22px; padding: 6px 16px; border: 2px dashed var(--line-2); border-radius: 10px; color: var(--lichen); }

/* ---------- Bildschirme ---------- */
.scr { position: absolute; inset: 0; transition: opacity .38s var(--ease-out), transform .38s var(--ease-out);
  text-shadow: var(--halo); }
.scr .tag, .scr .btn-primary, .scr .qr, .scr .bn-node.you, .scr .choice.is-correct .mark { text-shadow: none; }
.scr.enter { opacity: 0; transform: translateY(24px); }
.scr.leave { opacity: 0; transform: translateY(-16px); pointer-events: none; }
.abs { position: absolute; }

/* ---------- Schaltflächen ---------- */
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .choice:focus-visible { outline: 5px solid var(--glow); outline-offset: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 18px;
  min-height: 112px; padding: 0 54px; border-radius: 56px;
  font-family: var(--font-display); font-weight: 650; font-size: 38px; letter-spacing: -.01em;
  border: 3px solid transparent; transition: transform .15s var(--ease-out), background-color .2s, opacity .3s;
  white-space: nowrap;
}
.btn:active { transform: scale(.965); }
.btn svg { width: 40px; height: 40px; flex: none; }
.btn-primary { background: var(--btn-bg); color: var(--btn-ink); }
.btn-ghost { background: var(--ghost-bg); color: var(--text); border-color: var(--line-2); }
.btn-sm { min-height: 92px; padding: 0 36px; font-size: 32px; }
.btn-sm svg { width: 34px; height: 34px; }
.is-hidden { opacity: 0 !important; pointer-events: none !important; }

.choice {
  display: flex; align-items: center; gap: 26px; width: 100%;
  min-height: 140px; padding: 22px 36px; border-radius: 28px;
  background: var(--surface); border: 3px solid var(--line-1);
  font-family: var(--font-text); font-weight: 700; font-size: 40px; line-height: 1.2; text-align: left; color: var(--text);
  transition: transform .15s var(--ease-out), background-color .25s, border-color .25s, opacity .3s;
}
.choice:active { transform: scale(.98); }
.choice .mark { flex: none; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--line-2); display: grid; place-items: center; }
.choice .mark svg { width: 34px; height: 34px; opacity: 0; }
.choice .ctext { flex: 1; }
.choice .ctag { display: block; font-size: 26px; font-weight: 400; color: var(--glow); margin-top: 6px; }
.choice.is-correct { background: var(--surface-ok); border-color: var(--glow); }
.choice.is-correct .mark { background: var(--glow); border-color: var(--glow); color: var(--ink); }
.choice.is-correct .mark svg { opacity: 1; }
.choice.is-wrong { border-style: dashed; border-color: var(--line-2); }
.choice.is-dim { opacity: .42; }
.choice[disabled] { cursor: default; }

/* ---------- Etiketten (das wiederkehrende Motiv) ---------- */
.tag-wrap { position: absolute; filter: var(--tag-shadow); }
.tag {
  position: relative; display: block; text-align: left;
  background: var(--paper); color: var(--ink);
  padding: 84px 56px 50px;
  clip-path: polygon(52px 0, calc(100% - 52px) 0, 100% 52px, 100% 100%, 0 100%, 0 52px);
  -webkit-mask: radial-gradient(circle at 50% 38px, transparent 15px, #000 16px);
          mask: radial-gradient(circle at 50% 38px, transparent 15px, #000 16px);
  transform-origin: 50% 38px;
}
.tag .eyebrow { font-size: 26px; color: var(--ink-soft); margin-bottom: 10px; }
.tag .tag-title { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1.08; letter-spacing: -.015em; margin-bottom: 18px; }
.tag .tag-text { font-size: 36px; line-height: 1.4; }
.swing { animation: swing 1.1s var(--ease-out) both; }
@keyframes swing {
  0% { transform: translateY(-40px) rotate(-10deg); opacity: 0; }
  35% { opacity: 1; transform: translateY(0) rotate(5deg); }
  62% { transform: rotate(-2.4deg); }
  82% { transform: rotate(1deg); }
  100% { transform: rotate(0); }
}
.sdg-chip { display: inline-flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 18px; }
.sdg-chip b { display: inline-grid; place-items: center; min-width: 52px; height: 52px; padding: 0 8px; border-radius: 10px; background: var(--c); color: #fff; font-family: var(--font-display); font-size: 28px; }

/* QR */
.qr { background: #fff; border-radius: 16px; padding: 10px; line-height: 0; }
.qr svg { width: 100%; height: auto; display: block; }
.qr-url { font-size: 24px; color: var(--ink-soft); word-break: break-all; margin-top: 10px; }

/* ---------- Knoten ---------- */
.knot {
  position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 46%, color-mix(in srgb, var(--c) 62%, #000) 100%);
  box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 22%, transparent), 0 0 60px color-mix(in srgb, var(--c) 55%, transparent);
  touch-action: none; z-index: 2;
}
.knot::after {
  content: ""; position: absolute; inset: -22px; border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--c) 70%, #fff); opacity: 0;
  animation: ring 2.6s ease-out infinite;
}
.knot .knot-core { position: absolute; inset: 50px; border-radius: 50%; border: 5px solid rgba(255, 255, 255, .85); }
.knot.is-pulled::after { animation: none; }
.knot.is-pulled .knot-core { inset: 42px; background: rgba(255, 255, 255, .92); border: 0; }
.knot.is-current { box-shadow: 0 0 0 10px var(--glow), 0 0 70px color-mix(in srgb, var(--c) 70%, transparent); }
@keyframes ring { 0% { transform: scale(.85); opacity: .9; } 80%, 100% { transform: scale(1.35); opacity: 0; } }
.knot-label { position: absolute; width: 240px; margin-left: -120px; text-align: center; font-family: var(--font-display); font-weight: 650; font-size: 31px; line-height: 1.08; pointer-events: none; }

/* ---------- Dock ---------- */
.dock-home { flex: none; }
.dock-home.is-hidden { visibility: hidden; }
.dock-thread {
  flex: 1; min-width: 0; height: 104px; border-radius: 52px; display: flex; align-items: center; gap: 18px; padding: 0 30px 0 22px;
  background: var(--surface-2); border: 3px solid var(--line-1);
  transition: background-color .3s, border-color .3s;
}
.dock-thread.has-items { border-color: rgba(255, 231, 163, .55); }
.dock-thread.pop { animation: pop .6s var(--ease-spring); }
.dock-thread.flash { border-color: var(--flash, var(--glow)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--flash, var(--glow)) 35%, transparent), 0 0 38px color-mix(in srgb, var(--flash, var(--glow)) 45%, transparent); }
.dock-thread.flash svg.beads { display: none; }
.dock-thread.flash .dt-text { flex: 1; min-width: 0; align-items: center; }
.dock-thread.flash .dt-count { color: var(--text); font-weight: 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
.dock-thread svg.beads { flex: 1; height: 70px; min-width: 120px; }
.dock-thread .dt-text { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.dock-thread .dt-label { font-family: var(--font-display); font-weight: 650; font-size: 32px; }
.dock-thread .dt-count { font-size: 24px; color: var(--lichen); }
.dock-thread.is-hidden { visibility: hidden; }
.lang { flex: none; display: flex; gap: 6px; padding: 6px; border-radius: 56px; border: 3px solid var(--line-1); }
.lang button { width: 92px; height: 88px; border-radius: 44px; font-family: var(--font-display); font-weight: 750; font-size: 32px; color: var(--text); transition: background-color .2s, color .2s; }
.lang button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-ink); }

/* Toast */
.toast { position: absolute; left: 50%; top: 1556px; transform: translate(-50%, 30px); opacity: 0;
  background: var(--btn-bg); color: var(--btn-ink); border-radius: 50px; padding: 18px 40px; font-weight: 700; font-size: 32px;
  display: flex; align-items: center; gap: 16px; transition: opacity .3s, transform .45s var(--ease-spring); pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 30px; height: 30px; border-radius: 50%; background: var(--c, var(--glow)); display: block; }

/* ---------- Overlays ---------- */
.overlay { position: absolute; inset: 0; background: var(--overlay); display: grid; place-items: center; animation: fadein .3s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.idle-box { width: 820px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 30px; }
.idle-ring { width: 220px; height: 220px; }
.idle-ring circle { fill: none; stroke-width: 12; }
.err-box { width: 820px; text-align: center; }
.admin { width: 900px; max-height: 1700px; overflow: auto; background: var(--paper); color: var(--ink); border-radius: 28px; padding: 56px; }
.admin h2 { margin-bottom: 26px; }
.admin dl { display: grid; grid-template-columns: 360px 1fr; gap: 14px 24px; font-size: 28px; margin: 0 0 34px; }
.admin dt { color: var(--ink-soft); }
.admin dd { margin: 0; font-weight: 700; word-break: break-word; }
.admin .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
.admin .btn { font-size: 28px; min-height: 80px; padding: 0 30px; }
.admin .btn-ghost { color: var(--ink); border-color: var(--ink-soft); background: transparent; }
.admin .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- Anziehungsbildschirm ---------- */
.att-title { left: 60px; top: 24px; width: 960px; text-align: center; }
.att-tagline { left: 90px; top: 168px; width: 900px; text-align: center; color: var(--lichen); }
.att-art { left: 200px; top: 270px; width: 680px; height: 680px; }
.att-art svg { width: 100%; height: 100%; overflow: visible; }
.att-hook { left: 70px; top: 990px; width: 940px; height: 300px; text-align: center; display: flex; align-items: center; justify-content: center; transition: opacity .5s; }
.att-alt { left: 90px; top: 1300px; width: 900px; text-align: center; color: var(--lichen); transition: opacity .5s; }
.att-alt p + p { margin-top: 8px; }
.att-touch { left: 0; top: 1470px; width: 1080px; height: 170px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.att-touch .pulse { width: 74px; height: 74px; border-radius: 50%; background: var(--text); position: relative; }
.att-touch .pulse::before, .att-touch .pulse::after { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 3px solid var(--text); animation: ring 2.4s ease-out infinite; }
.att-touch .pulse::after { animation-delay: 1.2s; }
.att-touch p { font-family: var(--font-display); font-weight: 650; font-size: 38px; transition: opacity .4s; }
.fade-out { opacity: 0 !important; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--draw, 2.4s) var(--ease-out) forwards; }
.undraw { animation: undraw .9s ease-in forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes undraw { from { stroke-dashoffset: 0; opacity: 1; } to { stroke-dashoffset: -1; opacity: 0; } }

/* ---------- Startseite (Hub) ---------- */
.hub-head { left: 80px; top: 34px; width: 920px; display: flex; flex-direction: column; gap: 22px; }
.hub-head .hub-lead { color: var(--lichen); }
.hub-item { position: absolute; width: 860px; height: 230px; padding-right: 20px; display: flex; align-items: center; gap: 40px; text-align: left; }
.hub-item.right { flex-direction: row-reverse; text-align: right; }
.hub-item .hk {
  flex: none; width: 220px; height: 220px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--c) 50%, #fff) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 60%, #000) 100%);
  box-shadow: 0 0 0 12px color-mix(in srgb, var(--c) 20%, transparent), 0 0 80px color-mix(in srgb, var(--c) 50%, transparent);
  transition: transform .3s var(--ease-spring);
}

.scr-object .ob-art { pointer-events: none; transition: opacity .6s, left .7s var(--ease-out), top .7s var(--ease-out), width .7s var(--ease-out), height .7s var(--ease-out); }

  0% { transform: rotate(0); }
  30% { transform: translateY(14px) rotate(-5deg) scale(.98); }

:root[data-design="corporate"] {

  --brand-ring: conic-gradient(from -90deg,
    #8e0933 0 19.2deg, transparent 0 21.18deg, #ffb300 0 40.4deg, transparent 0 42.35deg, #14b0db 0 61.6deg, transparent 0 63.53deg,
    #df2821 0 82.7deg, transparent 0 84.7deg, #b50021 0 103.9deg, transparent 0 105.9deg, #4c8f26 0 125.1deg, transparent 0 127.1deg,
    #da9426 0 146.3deg, transparent 0 148.2deg, #db092c 0 167.4deg, transparent 0 169.4deg, #e75020 0 188.6deg, transparent 0 190.6deg,
    #d00055 0 209.8deg, transparent 0 211.8deg, #f5861a 0 231deg, transparent 0 232.9deg, #b5771f 0 252.1deg, transparent 0 254.1deg,
    #3a6c33 0 273.3deg, transparent 0 275.3deg, #0086cc 0 294.5deg, transparent 0 296.5deg, #60a422 0 315.7deg, transparent 0 317.6deg,
    #00578f 0 336.8deg, transparent 0 338.8deg, #093958 0 358deg, transparent 0 360deg);

/* Logo-Ring: die 17 Segmente als Markenzeichen um Knoten und Startpunkt */
:root[data-design="corporate"] .hub-item .hk::after,

  Fil.prototype.pulse = function (dir) {

  Fil.prototype.start = function () {

  Fil.prototype._loop = function (now) {

    this.alpha += (sh.alpha - this.alpha) * k;

  };

  Fil.prototype._strokeWhere = function (xs, ys, depth, front, style, lw) {
    var ctx = this.ctx, n = xs.length, open = false;

        h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () { storedSet('bne-commons', null); openAdmin(); } }, [h('span', { i18n: 'admin.commonsReset' })]),
        h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () { resetSession(); } }, [h('span', { i18n: 'admin.testReset' })]),
        D.config.stats.enabled ? h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () { try { localStorage.removeItem('bne-stats'); } catch (e) { /* ok */ } openAdmin(); } }, [h('span', { i18n: 'admin.statsReset' })]) : null,
        h('button', { class: 'btn btn-primary', type: 'button', onclick: closeAdmin }, [h('span', { i18n: 'ui.close' })])
      ]),
      issues ? h('pre', { class: 't-mini', style: { 'white-space': 'pre-wrap', 'max-height': '300px', overflow: 'auto' }, text: i18nIssues.slice(0, 40).join('\n') }) : null
    ]);
    ov.appendChild(panel);
    overlayRoot.appendChild(ov);
    applyI18n(ov);
  }
  // Für die nächste Vorführung: alles auf Anfang, Designwahl bleibt
  function newDemo() {
    try { localStorage.removeItem('bne-stats'); } catch (e) { /* ok */ }
    resetSession();
  }
  function closeAdmin() { var a = $('#admin'); if (a) a.remove(); adminOpen = false; bump(); }
  function setReduced(on) { document.body.classList.toggle('reduced', on); if (fil) fil.setReduced(on); }

  /* =========================================================== Optionale lokale Statistik */

  function readStats() { try { return JSON.parse(localStorage.getItem('bne-stats') || '{}'); } catch (e) { return {}; } }
  function stat(key) {
    if (!D || !D.config.stats || !D.config.stats.enabled) return;
    try { var s = readStats(); s[key] = (s[key] || 0) + 1; localStorage.setItem('bne-stats', JSON.stringify(s)); } catch (e) { /* ok */ }
  }

  /* =========================================================== Fehler */

  function showError() {
    if ($('#err')) return;
    var ov = h('div', { class: 'overlay', id: 'err' }, [h('div', { class: 'err-box' }, [
      h('h2', { class: 't-h2', i18n: 'ui.error.title', style: { 'margin-bottom': '24px' } }),
      h('p', { class: 't-lead muted', i18n: 'ui.error.text' })
    ])]);
    overlayRoot.appendChild(ov);
    if (D) applyI18n(ov);
    setTimeout(function () { ov.remove(); if (D) resetSession(); else location.reload(); }, 6000);
  }
  window.addEventListener('error', function (e) {
    console.error(e.error || e.message);
    errorCount++;
    if (!booted) return;
    if (errorCount > 8) location.reload();
  });
  window.addEventListener('unhandledrejection', function (e) { console.error(e.reason); errorCount++; });

  /* =========================================================== Start */

  function loadData() {
    if (window.BNE_DATA) return Promise.resolve(window.BNE_DATA);
    function get(f) { return fetch(f, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); }); }
    return Promise.all([get('content/config.json'), get('content/content.json'), get('content/translations.json')])
      .then(function (r) {
        var data = { config: r[0], content: r[1], i18n: r[2], logoSvg: null };
        var logo = data.config.brand && data.config.brand.logo;
        if (!logo || !/\.svg$/i.test(logo)) return data;
        return fetch(logo).then(function (res) { return res.ok ? res.text() : null; }).then(function (txt) { data.logoSvg = cleanSvg(txt); return data; }, function () { return data; });
      });
  }
  // Logo-SVG für das Einbetten vorbereiten: keine Skripte, Größe per CSS
  function cleanSvg(txt) {
    if (!txt || txt.indexOf('<svg') < 0) return null;
    txt = txt.slice(txt.indexOf('<svg'));
    return txt.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son[a-z]+="[^"]*"/gi, '')
      .replace(/<svg([^>]*?)\swidth="[^"]*"/, '<svg$1').replace(/<svg([^>]*?)\sheight="[^"]*"/, '<svg$1')
      .replace(/<svg/, '<svg aria-hidden="true" focusable="false"');
  }

  function fileHint() {
    // Ohne Server lassen sich die JSON-Dateien nicht laden: dreisprachiger Hinweis
    var txt = {
      fr: 'Ouvre ce dossier avec un petit serveur local (voir README) ou utilise la version autonome dans dist/.',
      de: 'Öffne diesen Ordner über einen lokalen Server (siehe README) oder nutze die eigenständige Version in dist/.',
      en: 'Open this folder through a local server (see README) or use the standalone version in dist/.'
    };
    screenEl.innerHTML = '';
    screenEl.appendChild(h('div', { class: 'abs', style: pos(90, 500, { width: '900px' }) }, ['fr', 'de', 'en'].map(function (l) { return h('p', { class: 't-lead', lang: l, style: { 'margin-bottom': '40px' }, text: txt[l] }); })));
  }

  function boot() {
    stage = $('#stage'); screenEl = $('#screen'); dock = $('#dock'); topbar = $('#topbar'); overlayRoot = $('#overlay-root');
    layout();
    window.addEventListener('resize', layout);

    loadData().then(function (data) {
      D = data;
      S.lang = params.get('lang') && D.config.languages.indexOf(params.get('lang')) >= 0 ? params.get('lang') : (D.config.defaultLanguage || 'fr');
      document.documentElement.lang = S.lang;
      i18nIssues = checkTranslations();
      if (i18nIssues.length) console.warn('[i18n] Unvollständige Übersetzungen:', i18nIssues);

      if (window.BNE_DATA && window.BNE_DATA.logoSvg) D.logoSvg = cleanSvg(window.BNE_DATA.logoSvg);
      var design = currentDesign();
      applyDesign(design, false);
      var theme = threadTheme(design);
      var reducedPref = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var reduced = D.config.animation.reducedMotion || reducedPref || params.get('reduced') === '1';
      fil = new Fil($('#fil'), { colors: theme.colors, mode: theme.mode, quality: params.get('quality') || D.config.animation.quality, reducedMotion: reduced, particles: D.config.animation.particles });
      if (reduced) document.body.classList.add('reduced');
      layout();
      fil.start();
      document.addEventListener('visibilitychange', function () { if (document.hidden) fil.stop(); else fil.start(); });

      buildChrome();
      updateDock(false);
      $('#preview-caption').setAttribute('data-i18n', 'preview.caption');

      // Berührungen: Faden reagiert, Inaktivität zurücksetzen
      var kiosk = params.get('kiosk') === '1' || D.config.kiosk.requestFullscreen;
      if (kiosk && (params.get('kiosk') === '1' || D.config.kiosk.hideCursor)) document.body.classList.add('hide-cursor');
      stage.addEventListener('pointerdown', function (e) {
        bump();
        var p = toStage(e); fil.touch(p.x, p.y, true);
        if (kiosk && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () { /* ok */ });
      });
      stage.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') { var p = toStage(e); fil.touch(p.x, p.y, true); } });
      window.addEventListener('pointerup', function () { fil.touch(0, 0, false); });
      window.addEventListener('pointercancel', function () { fil.touch(0, 0, false); });
      window.addEventListener('keydown', bump);
      ['contextmenu', 'dragstart', 'selectstart', 'gesturestart'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });

      setInterval(idleTick, 1000);
      var reloadedAt = 0;
      setInterval(function () {
        var at = D.config.kiosk.dailyReloadAt;
        if (!at || S.screen !== 'attract' || Date.now() - reloadedAt < 3600000) return;
        var d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (hm === at && performance.now() > 3600000) { reloadedAt = Date.now(); location.reload(); }
      }, 30000);

      go(params.get('screen') || 'attract', params.get('id') ? { id: params.get('id') } : {});
      applyI18n(document);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitAll(document); });
      booted = true;
      if (params.get('admin') === '1') openAdmin();

      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.BNE_DATA && params.get('sw') !== '0') {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline-Cache optional */ });
      }
    }).catch(function (err) {
      console.error(err);
      if (location.protocol === 'file:') { fileHint(); return; }
      showError();
    });
  }

  // Für automatisierte Tests
  window.BNE = { go: go, setLang: setLang, state: S, design: function (v) { if (v) applyDesign(v, false); return S.design; }, fil: function () { return fil; }, t: t, reset: function () { resetSession(); }, issues: function () { return i18nIssues; }, openAdmin: function () { openAdmin(); } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
